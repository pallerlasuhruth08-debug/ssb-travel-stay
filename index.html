<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKN Travel &amp; Stay · SSB Bengaluru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded non-render-blocking on purpose. A plain stylesheet link here holds up first paint until
     fonts.googleapis.com answers, so if that host is slow, filtered or silently dropped (ISP/campus
     firewalls do this) the page shows nothing at all and reads as "the app won't load" -- the same
     third-party-reachability trap that the Supabase CDN script caused before it was vendored.
     media="print" keeps it out of the critical path; onload promotes it once it actually arrives.
     Until then the CSS font stacks fall back to the local sans-serif/serif and the app is usable. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --saffron:#E07B39;--saffron-deep:#C25E2A;--ivory:#FBF6EF;--card:#FFFDF9;
    --ink:#3D2E22;--muted:#8A7663;--border:#E8D9C8;--band:#F3E7D8;
    --amber:#B8791F;--amber-bg:#FBEFD6;--green:#3F7A4E;--green-bg:#E4F0E4;
    --blue:#3C6E93;--blue-bg:#E1ECF3;--purple:#7A5C8E;--purple-bg:#EDE4F2;
    --red:#A8452F;--red-bg:#F7E3DE;
    --shadow:0 1px 3px rgba(61,46,34,.06),0 8px 24px rgba(61,46,34,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--ivory);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:1.1}

  header{background:linear-gradient(120deg,var(--saffron),var(--saffron-deep));color:#fff;padding:20px 24px}
  .head-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;font-weight:600}
  header h1{font-size:30px;margin-top:2px}
  header .venue{font-size:13px;opacity:.9;margin-top:2px}
  .head-user{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
  .head-user .who{text-align:right;font-size:12.5px;line-height:1.35}
  .head-user .who b{display:block;font-weight:600;font-size:13.5px}
  .head-user .who span{opacity:.85}
  .btn-out{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 13px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
  .btn-out:hover{background:rgba(255,255,255,.28)}

  .ribbon{background:var(--band);border-bottom:1px solid var(--border)}
  .ribbon-inner{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:6px;overflow-x:auto;font-size:12px;color:var(--muted);font-weight:600}
  .ribbon .step{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .ribbon .num{width:18px;height:18px;border-radius:50%;background:var(--saffron);color:#fff;display:grid;place-items:center;font-size:11px}
  .ribbon .arr{color:var(--border);font-size:14px}

  nav{background:var(--ivory);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .tabs{max-width:1120px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .tab{border:none;background:none;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:14px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.15s}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--saffron-deep);border-bottom-color:var(--saffron)}
  .tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;font-size:11px;line-height:18px;text-align:center;background:var(--saffron);color:#fff;border-radius:9px;vertical-align:1px}

  main{max-width:1120px;margin:0 auto;padding:28px 20px 90px}
  .view{display:none}.view.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .view-head{margin-bottom:20px}.view-head h2{font-size:28px}
  .view-head p{color:var(--muted);font-size:14px;margin-top:4px;max-width:660px}

  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
  .pad{padding:22px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  input,select,textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--border);border-radius:9px;padding:11px 12px;transition:.15s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--saffron);box-shadow:0 0 0 3px rgba(224,123,57,.15)}
  input:disabled,select:disabled{background:var(--band);color:var(--muted);cursor:not-allowed}
  .field{margin-bottom:15px}
  textarea{resize:vertical;min-height:64px}
  .hint{font-size:12px;color:var(--muted);margin-top:5px;text-transform:none;letter-spacing:0;font-weight:400}
  .linklike{background:none;border:none;padding:0;font:inherit;font-size:12.5px;color:var(--muted);text-decoration:underline;cursor:pointer}
  .linklike:hover{color:var(--saffron-deep)}

  .seg{display:inline-flex;background:var(--band);border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap}
  .seg button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:9px 16px;border-radius:7px;cursor:pointer;transition:.15s}
  .seg button.on{background:#fff;color:var(--saffron-deep);box-shadow:0 1px 3px rgba(61,46,34,.1)}

  .btn{font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:9px;padding:11px 20px;cursor:pointer;transition:.15s}
  .btn-primary{background:var(--saffron);color:#fff}.btn-primary:hover{background:var(--saffron-deep)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--saffron);color:var(--saffron-deep)}
  .btn-sm{padding:8px 14px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .file-drop{border:1.5px dashed var(--border);border-radius:9px;padding:12px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;background:#fff;transition:.15s}
  .file-drop:hover{border-color:var(--saffron);color:var(--saffron-deep);background:var(--band)}
  .file-drop.has-file{border-style:solid;border-color:var(--green);color:var(--green);background:var(--green-bg)}

  .trav-card{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff;position:relative}
  .trav-card .thead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .trav-card .tnum{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--saffron-deep)}
  .x-btn{background:var(--amber-bg);color:var(--amber);border:none;padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer}
  .x-btn:hover{background:var(--amber);color:#fff}

  .chk{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--ink);cursor:pointer;padding:10px 0}
  .chk input{width:auto}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
  .chip.submitted{background:var(--amber-bg);color:var(--amber)}
  .chip.approved{background:var(--purple-bg);color:var(--purple)}
  .chip.booked{background:var(--blue-bg);color:var(--blue)}
  .chip.complete{background:var(--green-bg);color:var(--green)}
  .chip.rejected{background:var(--red-bg);color:var(--red)}
  .chip.mode{background:var(--band);color:var(--muted)}
  .chip-dot{width:7px;height:7px;border-radius:50%;background:currentColor}

  .stepper{display:flex;align-items:center;gap:0;margin:14px 0 4px;overflow-x:auto;padding-bottom:4px}
  .stp{display:flex;align-items:center;flex:1;min-width:0}
  .stp .dot{width:24px;height:24px;border-radius:50%;background:var(--band);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;border:2px solid var(--border)}
  .stp.done .dot{background:var(--green);color:#fff;border-color:var(--green)}
  .stp.now .dot{background:var(--saffron);color:#fff;border-color:var(--saffron);box-shadow:0 0 0 4px rgba(224,123,57,.18)}
  .stp .lbl{font-size:11px;font-weight:600;color:var(--muted);margin-left:7px;white-space:nowrap}
  .stp.done .lbl,.stp.now .lbl{color:var(--ink)}
  .stp .line{flex:1;height:2px;background:var(--border);margin:0 8px;min-width:16px}
  .stp.done .line{background:var(--green)}

  .req{border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:12px;overflow:hidden}
  .req-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
  .req-head:hover{background:var(--band)}
  .req-avatar{width:40px;height:40px;border-radius:10px;background:var(--band);color:var(--saffron-deep);display:grid;place-items:center;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;flex-shrink:0}
  .req-head>div:nth-child(2){flex:1;min-width:0}
  .req-title{font-weight:600;font-size:15px;overflow-wrap:anywhere}.req-sub{font-size:12.5px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
  .req-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .caret{color:var(--muted);transition:.2s;font-size:13px}
  .req.open .caret{transform:rotate(90deg)}
  .req-body{display:none;padding:2px 18px 18px;border-top:1px solid var(--border)}
  .req.open .req-body{display:block}

  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 18px;padding:14px 0}
  .detail-grid>div{min-width:0}
  .detail-grid .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .detail-grid .v{font-size:14px;margin-top:2px;overflow-wrap:anywhere}

  .ptable-wrap{overflow-x:auto}
  .ptable{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 10px;min-width:720px}
  .ptable th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:2px solid var(--border);white-space:nowrap}
  .ptable td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
  .ptable tr:last-child td{border-bottom:none}

  .workbox{background:var(--band);border-radius:10px;padding:14px;margin-top:8px}
  .workbox label{margin-bottom:4px}
  .assigned{background:var(--green-bg);border:1px solid #cfe3cf;border-radius:8px;padding:9px 12px;font-size:13px;color:var(--green);font-weight:500;display:flex;align-items:center;gap:8px;margin-bottom:6px;overflow-wrap:anywhere}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .notice{background:var(--red-bg);border:1px solid #e8c6bc;color:var(--red);border-radius:9px;padding:10px 13px;font-size:13px;margin:10px 0;overflow-wrap:anywhere}

  table.master{width:100%;border-collapse:collapse;font-size:13.5px}
  table.master th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:2px solid var(--border)}
  table.master td{padding:11px 12px;border-bottom:1px solid var(--border)}
  table.master tr:last-child td{border-bottom:none}
  .occ .bar{height:6px;border-radius:3px;background:var(--band);margin-top:4px;overflow:hidden}
  .occ .bar span{display:block;height:100%;background:var(--saffron)}
  .alloc-row{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .alloc-row .field{flex:1;min-width:150px;margin:0}
  .alloc-row .field.btn-field{flex:0 0 auto}
  .alloc-row .field.btn-field label{visibility:hidden}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
  @media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
  .stat .n{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;color:var(--saffron-deep);line-height:1}
  .stat .l{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:4px}

  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .empty .big{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--ink);margin-bottom:4px}
  .divider{height:1px;background:var(--border);margin:18px 0}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:13px 16px 13px 22px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.35s;z-index:100;max-width:90vw;display:flex;align-items:center;gap:14px}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast-close{background:none;border:0;color:#fff;opacity:.7;font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
  .toast-close:hover{opacity:1}

  /* sign-in + public traveller pages */
  .auth-wrap{max-width:430px;margin:0 auto;padding:52px 20px 90px}
  .auth-wrap .card{margin-top:18px}
  .auth-head{text-align:center}
  .auth-head h2{font-size:26px}
  .auth-head p{color:var(--muted);font-size:13.5px;margin-top:4px}
  .auth-tabs{display:flex;gap:6px;margin-bottom:16px}
  .auth-tabs button{flex:1;border:1px solid var(--border);background:#fff;border-radius:9px;padding:10px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .auth-tabs button.on{border-color:var(--saffron);background:var(--band);color:var(--saffron-deep)}
  .loading{text-align:center;padding:70px 20px;color:var(--muted);font-size:14px}

  /* mobile */
  @media(max-width:640px){
    /* iOS Safari zooms in on focus for any input under 16px — this is the fix, not a size choice */
    input,select,textarea{font-size:16px}
    header{padding:16px}
    header h1{font-size:24px}
    .head-user{gap:10px}
    main{padding:22px 14px 80px}
    .view-head h2{font-size:23px}
    .card.pad,.pad{padding:16px}
    /* the freed-up width from the tighter padding above is just enough for two .field's to wrap onto
       one row, which then looks broken since a stacked column is clearer at this width anyway */
    .alloc-row{flex-direction:column;align-items:stretch}
    .alloc-row .field{width:100%}
    /* the hidden label on .btn-field only exists to align the button with the inputs in a row;
       stacked single-column it's just dead space, so collapse it */
    .alloc-row .btn-field label{display:none}
  }
  @media(max-width:480px){
    /* once the title block and the status/mode chips can't share a line, drop the chips to their own row
       instead of letting the card clip them (overflow:hidden on .req swallows anything past the edge) */
    .req-head{flex-wrap:wrap;row-gap:8px}
    .req-right{margin-left:0;width:100%;justify-content:flex-start}
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button class="toast-close" onclick="dismissToast()" aria-label="Dismiss">&times;</button></div>
<script src="./vendor/supabase.js"></script>
<script src="./app.js"></script>
</body>
</html>
